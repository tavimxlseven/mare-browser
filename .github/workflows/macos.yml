name: Noise Music for macOS
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [codex/noise-music-macos]
    tags: ['macos-v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: node --test linux/model.test.cjs
      - run: cargo build --locked --release
      - run: python3 macos/package.py
      - name: Verify archived app
        run: python3 -B macos/smoke.py dist/macos/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noise-macos-${{ matrix.arch }}
          path: |
            dist/macos/*.zip
            dist/macos/SHA256SUMS-*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/macos-v') || github.ref == 'refs/heads/codex/noise-music-macos')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: noise-macos-*
          merge-multiple: true
          path: dist/macos
      - name: Publish macOS preview
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          version="$(node -p "require('./macos/package.json').version")"
          release_tag="macos-v$version"
          if [[ "$SOURCE_REF" == refs/tags/* ]]; then
            test "$SOURCE_REF" = "refs/tags/$release_tag"
          fi
          cd dist/macos
          cat SHA256SUMS-arm64 SHA256SUMS-x64 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$release_tag" \
            "Noise-Music-$version-macos-arm64.zip" \
            "Noise-Music-$version-macos-x64.zip" SHA256SUMS \
            --target "$SOURCE_COMMIT" --prerelease --latest=false \
            --title "Noise Music $version para macOS" --notes-file ../../macos/RELEASE.md
