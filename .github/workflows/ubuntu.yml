name: Ubuntu 24.04
on:
  push:
    branches: [ubuntu-release, main]
    tags: ['ubuntu-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ubuntu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libsecret-tools xvfb dbus-x11 gnome-keyring libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - run: cargo fmt --all --check
      - run: node --test linux/model.test.cjs
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Build Ubuntu package
        run: python3 linux/package.py
      - name: Install and verify package
        run: |
          sudo apt-get install -y ./dist/compass-browser_*_amd64.deb
          dbus-run-session -- xvfb-run -a python3 linux/smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compass-ubuntu-amd64
          path: |
            dist/*.deb
            dist/SHA256SUMS
            dist/ubuntu-smoke.png
            dist/ubuntu-smoke.json
      - name: Publish Ubuntu release
        if: startsWith(github.ref, 'refs/tags/ubuntu-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/*.deb dist/SHA256SUMS --title 'Compass Browser — Ubuntu 24.04+ (amd64)' --notes-file linux/RELEASE.md --prerelease --latest=false
    permissions:
      contents: write
