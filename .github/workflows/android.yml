name: Android music
on:
  push:
    paths:
      [
        "android/**",
        "mobile/public/native-player.js",
        "scripts/music-native-check.cjs",
        ".github/workflows/android.yml",
      ]
  pull_request:
    paths:
      [
        "android/**",
        "mobile/public/native-player.js",
        "scripts/music-native-check.cjs",
        ".github/workflows/android.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: "8.11.1"
      - name: Test native web adapter
        run: node scripts/music-native-check.cjs
      - name: Test and build Android client
        run: gradle -p android testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test playback with screen off
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle -p android connectedDebugAndroidTest --console=plain
            adb pull /sdcard/Android/data/org.mare.music/files/screenshots screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-test-evidence
          path: |
            screenshots/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mare-music-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
