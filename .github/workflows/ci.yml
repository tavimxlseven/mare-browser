name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Validate JavaScript
        run: |
          node --check ui/app.js
          node --check ui/spotify.js
          node scripts/music-remote-check.cjs
          node --check ui/music-tools.js
          node --check ui/music-queue.js
          node --check ui/music-layout.js
          node scripts/music-queue-smoke.cjs
          node --check src/youtube.js
          node scripts/youtube-smoke.mjs
          node --check src/reader.js
          node --check scripts/smoke.mjs
          node --check scripts/platform-smoke.mjs
          node --check scripts/worker-smoke.mjs
          node --check scripts/spotify-smoke.mjs
          node --check scripts/release-smoke.mjs
          node --check scripts/lib/cdp.mjs
      - name: Build release
        run: cargo build --release --locked
      - name: Verify native app workers
        run: node scripts/worker-smoke.mjs --exe=target/release/mare-browser.exe
      - name: Verify Spotify local library worker
        run: node scripts/spotify-smoke.mjs --exe=target/release/mare-browser.exe
      - name: Build installer with WebView2 bootstrapper
        shell: pwsh
        run: ./scripts/installer.ps1 -BinaryDirectory "$env:GITHUB_WORKSPACE\target\release"
      - name: Verify installer in an isolated folder
        shell: pwsh
        run: |
          $setup=Get-ChildItem dist/Release/Mare-Setup-*-x64.exe | Select-Object -First 1
          $destination=Join-Path $env:RUNNER_TEMP 'mare-installer-qa'
          $process=Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCANCEL',"/DIR=$destination",'/TASKS=','/NOICONS' -WindowStyle Hidden -Wait -PassThru
          if($process.ExitCode -ne 0){throw "Installer exited $($process.ExitCode)"}
          if(-not(Test-Path -LiteralPath "$destination/Mare.exe")){throw 'Installed executable missing'}
          node scripts/worker-smoke.mjs "--exe=$destination/Mare.exe"
          node scripts/spotify-smoke.mjs "--exe=$destination/Mare.exe"
      - name: Verify public music search
        continue-on-error: true
        run: node scripts/spotify-smoke.mjs --exe=dist/InstallerPayload/app/Mare.exe --catalog
      - name: Upload release installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mare-browser-windows-x64
          path: dist/Release/
          if-no-files-found: error
          retention-days: 14
  release:
    needs: check-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download tested installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name mare-browser-windows-x64 --dir release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag='${{ github.ref_name }}'
          $notes="docs/releases/$tag.md"
          if(Test-Path -LiteralPath $notes){
            gh release create $tag --repo '${{ github.repository }}' --title "Maré $tag" --notes-file $notes release/*.exe release/SHA256SUMS.txt release/MUSIC-SOURCES.txt
          }else{
            gh release create $tag --repo '${{ github.repository }}' --title "Maré $tag" --generate-notes release/*.exe release/SHA256SUMS.txt release/MUSIC-SOURCES.txt
          }
