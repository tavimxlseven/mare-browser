[package]
name = "mare-browser"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "A desktop browser and on-demand Rust app platform"
license = "MIT"
keywords = ["browser", "webview", "desktop", "rust"]
categories = ["web-programming", "gui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
getrandom = "0.3"
base64 = "0.22.1"
sha2 = "0.10.9"
unicode-normalization = "0.1"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav", "symphonia-pcm", "symphonia-aac", "symphonia-isomp4"] }
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "debug-info"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ring = "0.17"

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.16.0", features = ["audio_thread_priority"] }
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Networking_WinHttp", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_Media_Multimedia", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_NetworkManagement_IpHelper"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[build-dependencies]
winresource = "0.1.34"
