plugins { id 'com.android.application' }
android {
    namespace 'org.mare.music'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'org.mare.music'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    signingConfigs {
        release {
            if (System.getenv('MARE_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('MARE_ANDROID_KEYSTORE'))
                storePassword System.getenv('MARE_ANDROID_STORE_PASSWORD')
                keyAlias 'mare'
                keyPassword System.getenv('MARE_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-database:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
